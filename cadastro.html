<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Cadastro | Backstage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header simple-header">

    <a class="brand" href="index.html">
      <span>Backstage</span>
      <small>MODA FEMININA</small>
    </a>

    <a href="index.html" class="back-link">
      ← Voltar à loja
    </a>

  </header>

  <main class="register-page">

    <section class="auth-card wide">

      <p class="eyebrow">
        FAÇA PARTE DA BACKSTAGE
      </p>

      <h1>
        Crie sua conta
      </h1>

      <p class="muted">
        Cadastre-se para acompanhar seus pedidos e salvar seus favoritos.
      </p>

      <form id="registerForm" class="register-grid">

        <label>
          Nome completo
          <input
            type="text"
            required
            placeholder="Seu nome completo"
          >
        </label>

        <label>
          Data de nascimento
          <input
            type="date"
            required
          >
        </label>

        <label>
          E-mail
          <input
            type="email"
            required
            placeholder="seu@email.com"
          >
        </label>

        <label>
          Telefone
          <input
            type="tel"
            placeholder="(11) 99999-9999"
          >
        </label>

        <label>
          Senha

          <div class="password-field">

            <input
              type="password"
              required
              minlength="6"
              placeholder="Mínimo de 6 caracteres"
            >

            <button
              type="button"
              class="toggle-pass"
            >
              ◉
            </button>

          </div>
        </label>

        <label>
          Confirmar senha

          <div class="password-field">

            <input
              type="password"
              required
              minlength="6"
              placeholder="Repita sua senha"
            >

            <button
              type="button"
              class="toggle-pass"
            >
              ◉
            </button>

          </div>
        </label>

        <div class="register-actions">

          <button
            class="btn btn-dark full"
            type="submit"
          >
            CADASTRAR
          </button>

          <div class="or">
            <span>Ou</span>
          </div>

          <a
            class="btn btn-outline full"
            href="index.html"
          >
            Continuar como convidada
          </a>

        </div>

      </form>

      <p class="auth-bottom">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>

    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
