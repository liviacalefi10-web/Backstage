<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Login | Backstage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header simple-header">

    <a class="brand" href="index.html">
      <span>Backstage</span>
      <small>MODA FEMININA</small>
    </a>

    <a href="index.html" class="back-link">
      ← Voltar à loja
    </a>

  </header>

  <main class="auth-page">

    <div class="auth-image"></div>

    <section class="auth-card">

      <p class="eyebrow">
        BEM-VINDA DE VOLTA!
      </p>

      <h1>
        Entre na sua conta
      </h1>

      <p class="muted">
        Acesse seus pedidos, favoritos e muito mais.
      </p>

      <form id="loginForm">

        <label>
          E-mail
          <input
            type="email"
            required
            placeholder="seu@email.com"
          >
        </label>

        <label>
          Senha

          <div class="password-field">

            <input
              type="password"
              required
              placeholder="••••••••"
            >

            <button
              type="button"
              class="toggle-pass"
            >
              ◉
            </button>

          </div>
        </label>

        <button
          class="btn btn-dark full"
          type="submit"
        >
          ENTRAR
        </button>

      </form>

      <div class="or">
        <span>Ou</span>
      </div>

      <a
        class="btn btn-outline full"
        href="index.html"
      >
        Continuar como convidada
      </a>

      <p class="auth-bottom">
        Ainda não tem conta?
        <a href="cadastro.html">
          Cadastre-se
        </a>
      </p>

    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
